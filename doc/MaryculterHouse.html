<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maryculter House | Hospitality Since 1225</title>
  
  <!-- Google Fonts: Playfair Display for Serif, Montserrat for Sans-Serif -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* Reset & Global */
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    
    body {
      font-family: 'Montserrat', sans-serif;
      color: #ffffff;
      background: #000;
      height: 100vh;
      overflow: hidden; /* No scrolling for the initial hero section */
      -webkit-font-smoothing: antialiased;
    }

    /* Cinematic Background Image */
    .hero-bg {
      position: absolute;
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%;
      background: url('maryculter_bg.png') center/cover no-repeat;
      z-index: 1;
      filter: contrast(1.1) brightness(0.9);
      /* Subtle scale animation for a premium feel */
      animation: zoomBg 20s infinite alternate linear;
    }
    
    @keyframes zoomBg {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }
    
    /* Overlay to ensure white text remains legible */
    .hero-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      /* A subtle gradient that darkens the top for nav and center for text */
      background: linear-gradient(
        to bottom, 
        rgba(30, 25, 20, 0.7) 0%, 
        rgba(30, 25, 20, 0.2) 20%, 
        rgba(30, 25, 20, 0.1) 40%, 
        rgba(30, 25, 20, 0.3) 70%, 
        rgba(30, 25, 20, 0.7) 100%
      );
      z-index: 2;
    }

    /* Main Container (On top of background) */
    .container {
      position: relative;
      z-index: 10;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Header & Navigation */
    header {
      width: 100%;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* Top Bar (Socials, Logo, Call to Actions) */
    .top-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 24px 60px;
    }

    /* Social Icons */
    .social-icons {
      display: flex; 
      gap: 20px; 
      align-items: center;
    }
    .social-icons svg {
      width: 14px; 
      fill: #ffffff; 
      cursor: pointer; 
      opacity: 0.8; 
      transition: opacity 0.3s ease;
    }
    .social-icons svg:hover { 
      opacity: 1; 
    }

    /* Logo Center */
    .logo {
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 6px;
      cursor: pointer;
    }
    .logo-icon {
      width: 30px; 
      height: 30px;
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      display: flex; 
      justify-content: center; 
      align-items: center;
      position: relative;
    }
    /* Pseudo-elements to recreate the abstract lines inside the circle logo */
    .logo-icon::before {
      content: '';
      position: absolute;
      width: 20px; height: 1.5px;
      background: #fff;
      transform: rotate(35deg);
    }
    .logo-icon::after {
      content: '';
      position: absolute;
      width: 20px; height: 1.5px;
      background: #fff;
      transform: rotate(-35deg);
    }
    .logo-text {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 500;
      line-height: 1;
      text-align: center;
    }

    /* Top Links (Right Side) */
    .top-links {
      display: flex; 
      justify-content: flex-end; 
      gap: 40px; 
      align-items: center;
    }
    .top-links a {
      color: #ffffff; 
      text-decoration: none; 
      font-size: 10px; 
      font-weight: 500;
      letter-spacing: 1.5px; 
      text-transform: uppercase;
      opacity: 0.85; 
      transition: opacity 0.3s ease;
    }
    .top-links a:hover { 
      opacity: 1; 
    }

    /* Nav Bar (Horizontal Menu) */
    .nav-bar {
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      padding: 24px 40px;
      display: flex; 
      justify-content: center; 
      flex-wrap: wrap;
      gap: 3.5vw;
    }
    .nav-bar a {
      color: #ffffff; 
      text-decoration: none; 
      font-size: 10px; 
      font-weight: 500;
      letter-spacing: 1.5px; 
      text-transform: uppercase;
      opacity: 0.8; 
      transition: all 0.3s ease;
      position: relative;
    }
    .nav-bar a:hover { 
      opacity: 1; 
    }
    /* Minimal hover underline */
    .nav-bar a::after {
      content: '';
      position: absolute;
      bottom: -4px; left: 50%;
      width: 0; height: 1px;
      background: #fff;
      transition: all 0.3s ease;
      transform: translateX(-50%);
    }
    .nav-bar a:hover::after {
      width: 100%;
    }

    /* Center Content */
    .center-content {
      flex: 1;
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center;
      text-align: center;
      margin-top: -5vh; /* Nudge slightly up to balance the bottom scroll indicator */
    }
    
    .main-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(3rem, 6.5vw, 6.5rem);
      font-weight: 400;
      margin-bottom: 25px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .sub-title {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 60px;
      opacity: 0.95;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    /* Play Video Button */
    .play-btn {
      width: 65px; 
      height: 65px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      display: flex; 
      justify-content: center; 
      align-items: center;
      cursor: pointer; 
      transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(4px);
    }
    .play-btn:hover { 
      background: rgba(255, 255, 255, 0.15); 
      transform: scale(1.08); 
    }
    .play-btn svg { 
      width: 14px; 
      fill: #ffffff; 
      margin-left: 4px; /* Optically center the triangle */
      opacity: 0.9;
    }

    /* Bottom Scroll Indicator */
    .scroll-indicator {
      position: absolute;
      bottom: 0; 
      left: 50%; 
      transform: translateX(-50%);
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 15px;
    }
    .scroll-text {
      font-size: 9px; 
      font-weight: 500; 
      letter-spacing: 2.5px; 
      text-transform: uppercase; 
      opacity: 0.8;
    }
    .scroll-line {
      width: 1px; 
      height: 40px; 
      background: rgba(255, 255, 255, 0.7);
    }

    /* Responsive Adjustments */
    @media (max-width: 1100px) {
      .nav-bar { gap: 2vw; padding: 20px; }
      .top-bar { padding: 20px 40px; }
    }

    @media (max-width: 900px) {
      .top-bar { 
        grid-template-columns: 1fr 1fr; 
        padding: 20px; 
        gap: 15px; 
      }
      .social-icons { display: none; }
      .logo { grid-column: 1 / 3; }
      .top-links { 
        grid-column: 1 / 3; 
        justify-content: center; 
      }
      .nav-bar { display: none; /* Hide full nav on mobile, would use hamburger */ }
    }
  </style>
</head>
<body>

        </div>

        <div class="logo">
          <div class="logo-icon"></div>
          <div class="logo-text">Maryculter<br>House</div>

        <!-- Bookings (Right) -->
        <div class="top-links">

    <div class="center-content">

  </div>

</body>
